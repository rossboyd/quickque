kind = "web"
previewPath = "/website/"
title = "Quickque Website"
description = "The public Quickque website: honest installation instructions and a practical, searchable guide to the local-first teleprompter."
version = "1.0.0"
id = "artifacts/quickque-website"
router = "path"

[[services]]
name = "web"
paths = [ "/website/", "/robots.txt", "/sitemap.xml" ]
localPort = 20353

[services.development]
run = "pnpm --filter @workspace/quickque-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/quickque-website", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/quickque-website", "run", "serve" ]

[services.env]
PORT = "20353"
BASE_PATH = "/website/"
