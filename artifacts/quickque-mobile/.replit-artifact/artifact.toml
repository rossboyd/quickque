kind = "mobile"
previewPath = "/quickque-mobile/"
title = "Quickque Mobile"
description = "A local-first iPhone teleprompter and Mac remote companion with native script editing, reader controls, offline storage, and clear device capability boundaries."
version = "1.0.0"
id = "artifacts/quickque-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/quickque-mobile/" ]
localPort = 24685

[services.development]
run = "pnpm --filter @workspace/quickque-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/quickque-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/quickque-mobile", "run", "serve" ]

[services.env]
PORT = "24685"
BASE_PATH = "/quickque-mobile/"
